[project]
name = "cortexa-backend"
version = "0.1.0"
description = "Cortexa AI Agent Platform — FastAPI backend (Phase 4 RAG foundation)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Cortexa Maintainers" }]

dependencies = [
  "fastapi>=0.115.0,<0.116",
  "uvicorn[standard]>=0.32.0,<0.33",
  "pydantic>=2.9.0,<3",
  "pydantic-settings>=2.6.0,<3",
  "email-validator>=2.2.0,<3",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30.0,<0.31",
  "alembic>=1.14.0,<1.15",
  "redis>=5.2.0,<6",
  "httpx>=0.28.0,<0.29",
  "argon2-cffi>=23.1.0,<26",
  "PyJWT>=2.9.0,<3",
  "pgvector>=0.3.6,<0.4",
  "pypdf>=5.1.0,<6",
  "python-docx>=1.1.2,<2",
  "python-multipart>=0.0.17,<0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9",
  "pytest-asyncio>=0.24.0,<0.25",
  "ruff>=0.8.0,<0.9",
  "mypy>=1.13.0,<2",
  "types-redis>=4.6.0",
]

[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: tests that require running Docker services",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
warn_unused_ignores = true
show_error_codes = true
plugins = []

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["argon2.*", "jwt.*", "pgvector.*", "pypdf.*", "docx.*"]
ignore_missing_imports = true
