name: cortexa-production

services:
  postgres:
    image: pgvector/pgvector:pg17
    env_file: [.env.production]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - cortexa_prod_postgres:/var/lib/postgresql/data
    networks: [cortexa-prod]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - cortexa_prod_redis:/data
    networks: [cortexa-prod]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.6.5
    volumes:
      - cortexa_prod_ollama:/root/.ollama
    networks: [cortexa-prod]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  backend:
    image: cortexa-backend-production
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    env_file: [.env.production]
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/${REDIS_DB:-0}
      DOCUMENT_STORAGE_PATH: /var/lib/cortexa/documents
    volumes:
      - cortexa_prod_documents:/var/lib/cortexa/documents
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      ollama: {condition: service_healthy}
    networks: [cortexa-prod]
    restart: unless-stopped

  worker:
    image: cortexa-backend-production
    env_file: [.env.production]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/${REDIS_DB:-0}
      DOCUMENT_STORAGE_PATH: /var/lib/cortexa/documents
    command: ["python", "-m", "app.jobs.worker"]
    volumes:
      - cortexa_prod_documents:/var/lib/cortexa/documents
    depends_on:
      backend: {condition: service_healthy}
    networks: [cortexa-prod]
    restart: unless-stopped

  frontend:
    image: cortexa-frontend-production
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${PUBLIC_HOST}
        NEXT_PUBLIC_PASSWORD_RESET_DEV_NOTICE: "false"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      backend: {condition: service_healthy}
    networks: [cortexa-prod]
    restart: unless-stopped

  caddy:
    image: caddy:2.9-alpine
    env_file: [.env.production]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - cortexa_prod_caddy_data:/data
      - cortexa_prod_caddy_config:/config
    depends_on:
      frontend: {condition: service_healthy}
      backend: {condition: service_healthy}
    networks: [cortexa-prod]
    restart: unless-stopped

networks:
  cortexa-prod:
    driver: bridge

volumes:
  cortexa_prod_postgres:
  cortexa_prod_redis:
  cortexa_prod_ollama:
  cortexa_prod_documents:
  cortexa_prod_caddy_data:
  cortexa_prod_caddy_config:
