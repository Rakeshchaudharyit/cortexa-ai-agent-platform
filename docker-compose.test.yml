# Cortexa AI Agent Platform — isolated automated-test stack
# Never shares volumes, databases, or Redis with the development Compose project.
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d postgres-test redis-test
#   docker compose -f docker-compose.test.yml run --rm backend-test alembic upgrade head
#   docker compose -f docker-compose.test.yml run --rm backend-test pytest
#   docker compose -f docker-compose.test.yml down
#
# Explicitly named test volumes only — never cortexa_postgres_data.

name: cortexa-test

services:
  postgres-test:
    image: pgvector/pgvector:pg17
    container_name: cortexa-postgres-test
    environment:
      POSTGRES_DB: cortexa_agent_test
      POSTGRES_USER: cortexa
      POSTGRES_PASSWORD: local_test_only
    # Host port avoids collision with development Postgres on 15432.
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - cortexa_postgres_test_data:/var/lib/postgresql/data
    networks:
      - cortexa-test-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortexa -d cortexa_agent_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: "no"

  redis-test:
    image: redis:7.4.2-alpine
    container_name: cortexa-redis-test
    # Ephemeral test Redis — no AOF / no shared volume with development.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:16380:6379"
    networks:
      - cortexa-test-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"

  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cortexa-backend-test
    working_dir: /app
    environment:
      PYTHONPATH: /app
      APP_NAME: Cortexa AI Agent Platform
      APP_ENV: test
      APP_DEBUG: "false"
      APP_VERSION: 0.1.0
      API_PREFIX: /api/v1
      LOG_LEVEL: WARNING
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      POSTGRES_HOST: postgres-test
      POSTGRES_PORT: 5432
      POSTGRES_DB: cortexa_agent_test
      POSTGRES_USER: cortexa
      POSTGRES_PASSWORD: local_test_only
      DATABASE_URL: postgresql+asyncpg://cortexa:local_test_only@postgres-test:5432/cortexa_agent_test
      REDIS_HOST: redis-test
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_URL: redis://redis-test:6379/0
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:13000,http://localhost:13000
      FRONTEND_ORIGIN: http://127.0.0.1:13000
      JWT_SECRET_KEY: test-only-cortexa-jwt-secret-key-32chars-min
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "14"
      AUTH_COOKIE_NAME: cortexa_refresh
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAMESITE: lax
      AUTH_COOKIE_PATH: /api/v1/auth
      PASSWORD_MIN_LENGTH: "12"
      PASSWORD_MAX_LENGTH: "128"
      PASSWORD_RESET_ENABLED: "true"
      PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: "30"
      PASSWORD_RESET_TOKEN_BYTES: "32"
      PASSWORD_RESET_MAX_ACTIVE_TOKENS: "3"
      PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS: "0"
      PASSWORD_RESET_FRONTEND_URL: http://127.0.0.1:13000/reset-password
      PASSWORD_RESET_DELIVERY_PROVIDER: development
      PASSWORD_RESET_DEV_EXPOSE_TOKEN: "false"
      PASSWORD_RESET_DEV_NOTICE_ENABLED: "true"
      EXPECTED_APPLICATION_ID: cortexa-ai-agent-platform
      EXPECTED_DATABASE_IDENTITY: cortexa-agent-test
      DATABASE_IDENTITY_CHECK_ENABLED: "true"
      LEGACY_DB_MIGRATION_ALLOW_PRODUCTION: "false"
      ADMIN_USER_CLI_ALLOW_PRODUCTION: "false"
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://127.0.0.1:9
      OLLAMA_MODEL: qwen2.5:7b
      OLLAMA_REQUEST_TIMEOUT_SECONDS: "5"
      OLLAMA_CONNECT_TIMEOUT_SECONDS: "1"
      LLM_MAX_INPUT_CHARACTERS: "1000"
      LLM_MAX_OUTPUT_TOKENS: "256"
      LLM_DEFAULT_TEMPERATURE: "0.2"
      DOCUMENT_UPLOAD_ENABLED: "true"
      DOCUMENT_STORAGE_PATH: /tmp/cortexa-test-documents
      DOCUMENT_MAX_FILE_SIZE_BYTES: "5242880"
      DOCUMENT_ALLOWED_EXTENSIONS: .txt,.md,.pdf,.docx
      DOCUMENT_MAX_TEXT_CHARACTERS: "500000"
      DOCUMENT_MAX_CHUNKS: "500"
      CHUNK_SIZE_CHARACTERS: "1200"
      CHUNK_OVERLAP_CHARACTERS: "200"
      CHUNK_MIN_CHARACTERS: "40"
      EMBEDDING_PROVIDER: ollama
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text
      EMBEDDING_DIMENSION: "768"
      EMBEDDING_BATCH_SIZE: "16"
      EMBEDDING_REQUEST_TIMEOUT_SECONDS: "5"
      EMBEDDING_MAX_INPUT_CHARACTERS: "8000"
      RAG_DEFAULT_TOP_K: "5"
      RAG_MAX_TOP_K: "20"
      RAG_MIN_SIMILARITY: "0.0"
      RAG_MAX_QUERY_CHARACTERS: "2000"
      RAG_MAX_CONTEXT_CHARACTERS: "12000"
      RAG_CITATION_EXCERPT_CHARACTERS: "280"
      CONVERSATION_MAX_HISTORY_MESSAGES: "8"
      CONVERSATION_MAX_HISTORY_CHARACTERS: "4000"
      CONVERSATION_MAX_CONTEXT_CHARACTERS: "8000"
      CONVERSATION_SUMMARY_TRIGGER_MESSAGES: "6"
      CONVERSATION_SUMMARY_MAX_CHARACTERS: "500"
      CONVERSATION_TITLE_MAX_CHARACTERS: "80"
      MESSAGE_MAX_CHARACTERS: "2000"
      MESSAGE_MAX_RESPONSE_TOKENS: "256"
      CHAT_DEFAULT_TEMPERATURE: "0.2"
      CHAT_DEFAULT_TOP_K: "5"
      CONVERSATION_SEARCH_MAX_RESULTS: "25"
      CONVERSATION_LIST_DEFAULT_LIMIT: "20"
      CONVERSATION_LIST_MAX_LIMIT: "50"
      CITATION_EXCERPT_MAX_CHARACTERS: "280"
      CONVERSATION_AUTO_TITLE_ENABLED: "true"
      CONVERSATION_SUMMARY_ENABLED: "true"
      CHAT_GENERAL_MODE_ENABLED: "true"
    volumes:
      # Live source so local fixes are tested without rebuilding the image every time.
      # PYTHONPATH=/app keeps imports working when the bind mount hides egg-info.
      - ./backend:/app
      - ./Makefile:/workspace/Makefile:ro
      - ./scripts:/workspace/scripts:ro
      - ./docker-compose.yml:/workspace/docker-compose.yml:ro
      - ./docker-compose.test.yml:/workspace/docker-compose.test.yml:ro
      - ./docs:/workspace/docs:ro
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - cortexa-test-net
    # One-shot runner — do not start uvicorn / do not touch development stack.
    # Force project isolation via `docker compose -p cortexa-test` in Make/scripts
    # (COMPOSE_PROJECT_NAME in .env would otherwise collide with development).
    entrypoint: ["sh", "-c"]
    command: ["pytest"]
    restart: "no"

networks:
  cortexa-test-net:
    name: cortexa-test-net
    external: true

volumes:
  cortexa_postgres_test_data:
    name: cortexa_postgres_test_data
    external: true
