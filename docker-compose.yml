# Cortexa AI Knowledge Platform — local Docker Compose
# Real runnable services: backend, frontend, postgres (pgvector), redis, ollama.
# Ollama runs without pulling models. Models must be pulled explicitly.
# Embedding model example:
#   docker compose exec ollama ollama pull nomic-embed-text

name: cortexa

services:
  backend:
    image: cortexa-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cortexa-backend
    env_file:
      - .env
    environment:
      APP_NAME: ${APP_NAME:-Cortexa AI Knowledge Platform}
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-cortexa_agent}
      POSTGRES_USER: ${POSTGRES_USER:-cortexa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cortexa}:${POSTGRES_PASSWORD:-local_development_only}@postgres:5432/${POSTGRES_DB:-cortexa_agent}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_URL: redis://redis:6379/${REDIS_DB:-0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:13000,http://127.0.0.1:13000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://127.0.0.1:13000}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-cortexa-jwt-secret-replace-before-production-use-32b}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-cortexa_refresh}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_COOKIE_PATH: ${AUTH_COOKIE_PATH:-/api/v1/auth}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
      PASSWORD_MAX_LENGTH: ${PASSWORD_MAX_LENGTH:-128}
      PASSWORD_RESET_ENABLED: ${PASSWORD_RESET_ENABLED:-true}
      PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRE_MINUTES:-30}
      PASSWORD_RESET_TOKEN_BYTES: ${PASSWORD_RESET_TOKEN_BYTES:-32}
      PASSWORD_RESET_MAX_ACTIVE_TOKENS: ${PASSWORD_RESET_MAX_ACTIVE_TOKENS:-3}
      PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS: ${PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS:-60}
      PASSWORD_RESET_FRONTEND_URL: ${PASSWORD_RESET_FRONTEND_URL:-http://127.0.0.1:13000/reset-password}
      PASSWORD_RESET_DELIVERY_PROVIDER: ${PASSWORD_RESET_DELIVERY_PROVIDER:-development}
      PASSWORD_RESET_DEV_EXPOSE_TOKEN: ${PASSWORD_RESET_DEV_EXPOSE_TOKEN:-false}
      PASSWORD_RESET_DEV_NOTICE_ENABLED: ${PASSWORD_RESET_DEV_NOTICE_ENABLED:-true}
      EXPECTED_APPLICATION_ID: ${EXPECTED_APPLICATION_ID:-cortexa-ai-agent-platform}
      EXPECTED_DATABASE_IDENTITY: ${EXPECTED_DATABASE_IDENTITY:-cortexa-agent-development}
      DATABASE_IDENTITY_CHECK_ENABLED: ${DATABASE_IDENTITY_CHECK_ENABLED:-true}
      LEGACY_DB_MIGRATION_ALLOW_PRODUCTION: ${LEGACY_DB_MIGRATION_ALLOW_PRODUCTION:-false}
      ADMIN_USER_CLI_ALLOW_PRODUCTION: ${ADMIN_USER_CLI_ALLOW_PRODUCTION:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_REQUEST_TIMEOUT_SECONDS: ${OLLAMA_REQUEST_TIMEOUT_SECONDS:-120}
      OLLAMA_CONNECT_TIMEOUT_SECONDS: ${OLLAMA_CONNECT_TIMEOUT_SECONDS:-5}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_FIRST_TOKEN_TIMEOUT_SECONDS: ${OLLAMA_FIRST_TOKEN_TIMEOUT_SECONDS:-60}
      LLM_MAX_INPUT_CHARACTERS: ${LLM_MAX_INPUT_CHARACTERS:-32000}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2048}
      LLM_DEFAULT_TEMPERATURE: ${LLM_DEFAULT_TEMPERATURE:-0.7}
      DOCUMENT_UPLOAD_ENABLED: ${DOCUMENT_UPLOAD_ENABLED:-true}
      DOCUMENT_STORAGE_PATH: /var/lib/cortexa/documents
      DOCUMENT_MAX_FILE_SIZE_BYTES: ${DOCUMENT_MAX_FILE_SIZE_BYTES:-5242880}
      DOCUMENT_ALLOWED_EXTENSIONS: ${DOCUMENT_ALLOWED_EXTENSIONS:-.txt,.md,.pdf,.docx}
      DOCUMENT_MAX_TEXT_CHARACTERS: ${DOCUMENT_MAX_TEXT_CHARACTERS:-500000}
      DOCUMENT_MAX_CHUNKS: ${DOCUMENT_MAX_CHUNKS:-500}
      CHUNK_SIZE_CHARACTERS: ${CHUNK_SIZE_CHARACTERS:-1200}
      CHUNK_OVERLAP_CHARACTERS: ${CHUNK_OVERLAP_CHARACTERS:-200}
      CHUNK_MIN_CHARACTERS: ${CHUNK_MIN_CHARACTERS:-40}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      EMBEDDING_REQUEST_TIMEOUT_SECONDS: ${EMBEDDING_REQUEST_TIMEOUT_SECONDS:-60}
      EMBEDDING_MAX_INPUT_CHARACTERS: ${EMBEDDING_MAX_INPUT_CHARACTERS:-8000}
      RAG_DEFAULT_TOP_K: ${RAG_DEFAULT_TOP_K:-5}
      RAG_MAX_TOP_K: ${RAG_MAX_TOP_K:-20}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.4}
      RAG_MAX_QUERY_CHARACTERS: ${RAG_MAX_QUERY_CHARACTERS:-2000}
      RAG_MAX_CONTEXT_CHARACTERS: ${RAG_MAX_CONTEXT_CHARACTERS:-12000}
      RAG_CITATION_EXCERPT_CHARACTERS: ${RAG_CITATION_EXCERPT_CHARACTERS:-280}
      CONVERSATION_MAX_HISTORY_MESSAGES: ${CONVERSATION_MAX_HISTORY_MESSAGES:-20}
      CONVERSATION_MAX_HISTORY_CHARACTERS: ${CONVERSATION_MAX_HISTORY_CHARACTERS:-16000}
      CONVERSATION_MAX_CONTEXT_CHARACTERS: ${CONVERSATION_MAX_CONTEXT_CHARACTERS:-24000}
      CONVERSATION_SUMMARY_TRIGGER_MESSAGES: ${CONVERSATION_SUMMARY_TRIGGER_MESSAGES:-12}
      CONVERSATION_SUMMARY_MAX_CHARACTERS: ${CONVERSATION_SUMMARY_MAX_CHARACTERS:-1500}
      CONVERSATION_TITLE_MAX_CHARACTERS: ${CONVERSATION_TITLE_MAX_CHARACTERS:-80}
      MESSAGE_MAX_CHARACTERS: ${MESSAGE_MAX_CHARACTERS:-8000}
      MESSAGE_MAX_RESPONSE_TOKENS: ${MESSAGE_MAX_RESPONSE_TOKENS:-2048}
      CHAT_DEFAULT_TEMPERATURE: ${CHAT_DEFAULT_TEMPERATURE:-0.4}
      CHAT_DEFAULT_TOP_K: ${CHAT_DEFAULT_TOP_K:-5}
      CONVERSATION_SEARCH_MAX_RESULTS: ${CONVERSATION_SEARCH_MAX_RESULTS:-25}
      CONVERSATION_LIST_DEFAULT_LIMIT: ${CONVERSATION_LIST_DEFAULT_LIMIT:-20}
      CONVERSATION_LIST_MAX_LIMIT: ${CONVERSATION_LIST_MAX_LIMIT:-50}
      CITATION_EXCERPT_MAX_CHARACTERS: ${CITATION_EXCERPT_MAX_CHARACTERS:-280}
      CONVERSATION_AUTO_TITLE_ENABLED: ${CONVERSATION_AUTO_TITLE_ENABLED:-true}
      CONVERSATION_SUMMARY_ENABLED: ${CONVERSATION_SUMMARY_ENABLED:-true}
      CHAT_GENERAL_MODE_ENABLED: ${CHAT_GENERAL_MODE_ENABLED:-true}
    volumes:
      - cortexa_documents_data:/var/lib/cortexa/documents
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cortexa-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped

  worker:
    image: cortexa-backend
    container_name: cortexa-worker
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-cortexa_agent}
      POSTGRES_USER: ${POSTGRES_USER:-cortexa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cortexa}:${POSTGRES_PASSWORD:-local_development_only}@postgres:5432/${POSTGRES_DB:-cortexa_agent}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_URL: redis://redis:6379/${REDIS_DB:-0}
      DOCUMENT_STORAGE_PATH: /var/lib/cortexa/documents
      WORKER_ID: ${WORKER_ID:-cortexa-worker-1}
    command: ["python", "-m", "app.jobs.worker"]
    volumes:
      - cortexa_documents_data:/var/lib/cortexa/documents
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cortexa-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from redis import Redis; import sys; r=Redis(host='redis',port=6379,decode_responses=True); sys.exit(0 if r.get('cortexa:jobs:worker:heartbeat') else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cortexa-frontend
    working_dir: /app
    environment:
      # Must share the browser hostname (localhost vs 127.0.0.1). Mixing breaks refresh cookies.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:18000}
      NEXT_PUBLIC_PASSWORD_RESET_DEV_NOTICE: ${NEXT_PUBLIC_PASSWORD_RESET_DEV_NOTICE:-true}
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    command: ["npm", "run", "dev"]
    volumes:
      - ./frontend:/app
      - cortexa_frontend_node_modules:/app/node_modules
      - cortexa_frontend_next:/app/.next
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cortexa-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    container_name: cortexa-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cortexa_agent}
      POSTGRES_USER: ${POSTGRES_USER:-cortexa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
    # Bound to localhost only for local development tooling (psql, GUI clients).
    # Not published on all interfaces.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cortexa_postgres_data:/var/lib/postgresql/data
    networks:
      - cortexa-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    container_name: cortexa-redis
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    # Bound to localhost only for local development tooling.
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - cortexa_redis_data:/data
    networks:
      - cortexa-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.6.5
    container_name: cortexa-ollama
    # No model pull on start. Pull explicitly, for example:
    #   docker compose exec ollama ollama pull qwen2.5:7b
    #   docker compose exec ollama ollama pull nomic-embed-text
    # Host port mapping avoids clash with a local Ollama install on :11434.
    # Backend uses the Compose DNS name: http://ollama:11434
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11435}:11434"
    volumes:
      - cortexa_ollama_data:/root/.ollama
    networks:
      - cortexa-net
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

networks:
  cortexa-net:
    name: cortexa-net
    driver: bridge

volumes:
  cortexa_postgres_data:
    name: cortexa_postgres_data
  cortexa_redis_data:
    name: cortexa_redis_data
  cortexa_ollama_data:
    name: cortexa_ollama_data
  cortexa_documents_data:
    name: cortexa_documents_data
  cortexa_frontend_node_modules:
    name: cortexa_frontend_node_modules
  cortexa_frontend_next:
    name: cortexa_frontend_next
