# Cortexa AI Agent Platform — local Docker Compose (Phase 3)
# Real runnable services: backend, frontend, postgres, redis, ollama.
# Ollama runs without pulling models. Models must be pulled explicitly.

name: cortexa

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cortexa-backend
    env_file:
      - .env
    environment:
      APP_NAME: ${APP_NAME:-Cortexa AI Agent Platform}
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-cortexa_agent}
      POSTGRES_USER: ${POSTGRES_USER:-cortexa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cortexa}:${POSTGRES_PASSWORD:-local_development_only}@postgres:5432/${POSTGRES_DB:-cortexa_agent}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_URL: redis://redis:6379/${REDIS_DB:-0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:13000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-cortexa-jwt-secret-replace-before-production-use-32b}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-cortexa_refresh}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_COOKIE_PATH: ${AUTH_COOKIE_PATH:-/api/v1/auth}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
      PASSWORD_MAX_LENGTH: ${PASSWORD_MAX_LENGTH:-128}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_REQUEST_TIMEOUT_SECONDS: ${OLLAMA_REQUEST_TIMEOUT_SECONDS:-120}
      OLLAMA_CONNECT_TIMEOUT_SECONDS: ${OLLAMA_CONNECT_TIMEOUT_SECONDS:-5}
      LLM_MAX_INPUT_CHARACTERS: ${LLM_MAX_INPUT_CHARACTERS:-32000}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2048}
      LLM_DEFAULT_TEMPERATURE: ${LLM_DEFAULT_TEMPERATURE:-0.7}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cortexa-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cortexa-frontend
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    command: ["npm", "run", "dev"]
    volumes:
      - ./frontend:/app
      - cortexa_frontend_node_modules:/app/node_modules
      - cortexa_frontend_next:/app/.next
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cortexa-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  postgres:
    image: postgres:17.4-alpine
    container_name: cortexa-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cortexa_agent}
      POSTGRES_USER: ${POSTGRES_USER:-cortexa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
    # Bound to localhost only for local development tooling (psql, GUI clients).
    # Not published on all interfaces.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cortexa_postgres_data:/var/lib/postgresql/data
    networks:
      - cortexa-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    container_name: cortexa-redis
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    # Bound to localhost only for local development tooling.
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - cortexa_redis_data:/data
    networks:
      - cortexa-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.6.5
    container_name: cortexa-ollama
    # No model pull on start. Pull explicitly, for example:
    #   docker compose exec ollama ollama pull qwen2.5:7b
    # Host port mapping avoids clash with a local Ollama install on :11434.
    # Backend uses the Compose DNS name: http://ollama:11434
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11435}:11434"
    volumes:
      - cortexa_ollama_data:/root/.ollama
    networks:
      - cortexa-net
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

networks:
  cortexa-net:
    name: cortexa-net
    driver: bridge

volumes:
  cortexa_postgres_data:
    name: cortexa_postgres_data
  cortexa_redis_data:
    name: cortexa_redis_data
  cortexa_ollama_data:
    name: cortexa_ollama_data
  cortexa_frontend_node_modules:
    name: cortexa_frontend_node_modules
  cortexa_frontend_next:
    name: cortexa_frontend_next
